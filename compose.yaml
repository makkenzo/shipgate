name: shipgate

x-shipgate-environment:
  &shipgate-environment
  NODE_ENV: production
  APP_VERSION: ${APP_VERSION:-0.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://shipgate:shipgate@postgres:5432/shipgate}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
  DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-0}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
  DATABASE_MAX_LIFETIME_SECONDS: ${DATABASE_MAX_LIFETIME_SECONDS:-300}
  DATABASE_READINESS_TIMEOUT_MS: ${DATABASE_READINESS_TIMEOUT_MS:-2000}

  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}

  JOB_WORKER_CONCURRENCY: ${JOB_WORKER_CONCURRENCY:-4}
  JOB_WORKER_POLL_INTERVAL_MS: ${JOB_WORKER_POLL_INTERVAL_MS:-2000}
  JOB_WORKER_HEARTBEAT_INTERVAL_MS: ${JOB_WORKER_HEARTBEAT_INTERVAL_MS:-10000}
  JOB_WORKER_HEARTBEAT_STALE_AFTER_MS: ${JOB_WORKER_HEARTBEAT_STALE_AFTER_MS:-60000}

x-shipgate-application-environment:
  &shipgate-application-environment
  <<: *shipgate-environment

  APP_ORIGIN: ${APP_ORIGIN:-}

  AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
  AUTH_OAUTH_ATTEMPT_TTL_SECONDS: ${AUTH_OAUTH_ATTEMPT_TTL_SECONDS:-600}

  GITHUB_APP_STARTUP_VALIDATION_ENABLED: ${GITHUB_APP_STARTUP_VALIDATION_ENABLED:-true}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  GITHUB_APP_USER_TOKENS_EXPIRE: ${GITHUB_APP_USER_TOKENS_EXPIRE:-true}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
  GITHUB_OAUTH_URL: ${GITHUB_OAUTH_URL:-https://github.com}
  GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
  GITHUB_API_REQUEST_TIMEOUT_MS: ${GITHUB_API_REQUEST_TIMEOUT_MS:-10000}
  GITHUB_TOKEN_EARLY_REFRESH_MS: ${GITHUB_TOKEN_EARLY_REFRESH_MS:-300000}
  GITHUB_REFRESH_LEASE_MS: ${GITHUB_REFRESH_LEASE_MS:-60000}
  GITHUB_REFRESH_LEASE_POLL_MS: ${GITHUB_REFRESH_LEASE_POLL_MS:-100}
  GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
  GITHUB_TOKEN_ENCRYPTION_KEY_ID: ${GITHUB_TOKEN_ENCRYPTION_KEY_ID:-primary}

x-shipgate-service:
  &shipgate-service
  image: shipgate:local

  build:
    context: .
    target: runtime

  pull_policy: build

  init: true
  read_only: true

  tmpfs:
    - /tmp:size=64m,mode=1777

  security_opt:
    - no-new-privileges:true

  cap_drop:
    - ALL

  pids_limit: 256
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:18.4-alpine3.24

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipgate}
      POSTGRES_USER: ${POSTGRES_USER:-shipgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipgate}

    ports:
      - '${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432'

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    restart: unless-stopped

    cpus: 2
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256

  shipgate-migrate:
    <<: *shipgate-service

    command:
      - node
      - dist/migrate.js

    environment:
      <<: *shipgate-environment

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

    cpus: 1
    mem_limit: 512m
    mem_reservation: 128m

  shipgate-api:
    <<: *shipgate-service

    command:
      - node
      - dist/api.js

    environment:
      <<: *shipgate-application-environment

      HOST: 0.0.0.0
      PORT: 3000

      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-65536}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      API_DIAGNOSTICS_ENABLED: ${API_DIAGNOSTICS_ENABLED:-false}
      API_METRICS_ENABLED: ${API_METRICS_ENABLED:-false}

    ports:
      - '${SHIPGATE_HTTP_HOST:-127.0.0.1}:${SHIPGATE_HTTP_PORT:-3001}:3000'

    depends_on:
      shipgate-migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => {
            if (!response.ok) process.exit(1)
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    cpus: 1
    mem_limit: 512m
    mem_reservation: 128m

  shipgate-worker:
    <<: *shipgate-service

    command:
      - node
      - dist/worker.js

    environment:
      <<: *shipgate-application-environment

    depends_on:
      shipgate-migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - dist/worker-healthcheck.js
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    cpus: 1
    mem_limit: 512m
    mem_reservation: 128m

  # Optional development-profile API.
  # Production services remain the default profile.
  shipgate-api-dev:
    <<: *shipgate-service

    profiles:
      - development

    command:
      - node
      - dist/api.js

    environment:
      <<: *shipgate-application-environment

      NODE_ENV: development
      LOG_LEVEL: debug

      HOST: 0.0.0.0
      PORT: 3000

      API_DOCS_ENABLED: 'true'
      API_DIAGNOSTICS_ENABLED: 'true'
      API_METRICS_ENABLED: 'true'
      API_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    ports:
      - '127.0.0.1:3002:3000'

    depends_on:
      shipgate-migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    cpus: 1
    mem_limit: 512m

volumes:
  postgres-data:
