name: shipgate

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: shipgate
      POSTGRES_USER: shipgate
      POSTGRES_PASSWORD: shipgate
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U shipgate -d shipgate
      interval: 2s
      timeout: 2s
      retries: 20

  migrator:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shipgate:shipgate@postgres:5432/shipgate
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_MAX: 2
    command:
      - sh
      - -c
      - >-
        node packages/jobs/dist/migration-cli.js up
        &&
        node packages/database/dist/migration-cli.js up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://shipgate:shipgate@postgres:5432/shipgate
      DATABASE_SSL_MODE: disable
    command:
      - node
      - apps/server/dist/api.js
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shipgate:shipgate@postgres:5432/shipgate
      DATABASE_SSL_MODE: disable
    command:
      - node
      - apps/server/dist/worker.js
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
